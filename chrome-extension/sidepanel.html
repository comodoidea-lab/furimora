<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>フリモーラ サイドパネル</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #f5f5f5;
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  #app-frame {
    border: 0;
    width: 100%;
    height: calc(100% - 44px);
    background: #fff;
  }

  #toolbar {
    height: 44px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px;
    border-bottom: 1px solid #e8e8e8;
    background: #ffffff;
  }

  .btn {
    border: 0;
    border-radius: 999px;
    padding: 6px 10px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
  }

  .btn-primary {
    background: #bb0017;
    color: #fff;
  }

  .btn-secondary {
    background: #efefef;
    color: #222;
  }

  #notice {
    font-size: 10px;
    color: #666;
    margin-left: auto;
    white-space: nowrap;
  }

  #error {
    display: none;
    padding: 16px;
    color: #bb0017;
    font-size: 13px;
  }
</style>
</head>
<body>
  <div id="toolbar">
    <button class="btn btn-primary" id="btn-open-tab" type="button">ログインを別タブで開く</button>
    <button class="btn btn-secondary" id="btn-reload" type="button">再読込</button>
    <span id="notice">白画面時は別タブでログインしてください</span>
  </div>
  <iframe id="app-frame" title="フリモーラ"></iframe>
  <div id="error">
    サイドパネル表示がブロックされました。<br/>
    「ログインを別タブで開く」でログイン後、再読込してください。
  </div>
  <script src="sidepanel.js"></script>
</body>
</html>
